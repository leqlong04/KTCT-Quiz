<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập Kinh Tế Chính Trị Mác–Lênin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --surface: #13162a;
    --surface2: #1b1f38;
    --border: #2a2f55;
    --accent: #f0c040;
    --accent2: #e8834a;
    --text: #e8eaf6;
    --text-muted: #7880b0;
    --correct: #3ecf6c;
    --wrong: #e05c6b;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 10%, #1e2450 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 90%, #1a1230 0%, transparent 50%);
  }

  /* Header */
  header {
    padding: 40px 24px 20px;
    text-align: center;
    position: relative;
  }

  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 99px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 400;
  }

  /* Chapter tabs */
  .chapter-nav {
    display: flex;
    gap: 8px;
    padding: 0 24px 24px;
    max-width: 900px;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chapter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-family: 'Be Vietnam Pro', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .chapter-btn:hover, .chapter-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border-color: transparent;
    font-weight: 700;
  }

  /* Stats bar */
  .stats-bar {
    max-width: 900px;
    margin: 0 auto 24px;
    padding: 0 24px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .dot-progress { background: var(--accent); }
  .dot-correct { background: var(--correct); }
  .dot-wrong { background: var(--wrong); }

  .progress-track {
    flex: 1;
    min-width: 160px;
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* Question card */
  .quiz-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .q-number {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-weight: 800;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 99px;
  }

  .q-chapter {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
  }

  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 22px;
  }

  /* Options */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 14px;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.5;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(240,192,64,0.06);
    transform: translateX(3px);
  }

  .option-letter {
    min-width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option-btn.selected .option-letter {
    background: var(--accent);
    color: #000;
  }

  .option-btn.correct {
    background: rgba(62,207,108,0.1);
    border-color: var(--correct);
    color: #fff;
  }

  .option-btn.correct .option-letter {
    background: var(--correct);
    color: #000;
  }

  .option-btn.wrong {
    background: rgba(224,92,107,0.1);
    border-color: var(--wrong);
    color: #fff;
  }

  .option-btn.wrong .option-letter {
    background: var(--wrong);
    color: #fff;
  }

  .option-btn:disabled { cursor: default; }

  /* Result badge per question */
  .result-badge {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .result-badge.show { display: flex; }

  .result-badge.correct-msg {
    background: rgba(62,207,108,0.12);
    border: 1px solid rgba(62,207,108,0.3);
    color: var(--correct);
  }

  .result-badge.wrong-msg {
    background: rgba(224,92,107,0.12);
    border: 1px solid rgba(224,92,107,0.3);
    color: #ff8a96;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 28px;
    border: none;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(240,192,64,0.25); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 28px;
    border: 1px solid var(--border);
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* Final result panel */
  #result-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s ease;
  }

  #result-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .result-score {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }

  .result-grid {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .result-stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    min-width: 120px;
  }

  .result-stat .num {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
  }

  .result-stat .lbl {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .correct-num { color: var(--correct); }
  .wrong-num { color: var(--wrong); }

  .result-msg {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 32px;
    color: var(--text);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  /* Loader */
  #quiz-area { position: relative; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); box-shadow: 0 0 20px rgba(240,192,64,0.5); }
  }

  @media (max-width: 600px) {
    .question-card { padding: 20px; }
    .q-text { font-size: 14px; }
    .option-btn { font-size: 13px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">Ôn Thi Cuối Kỳ</div>
  <h1>Kinh Tế Chính Trị Mác–Lênin</h1>
  <p class="subtitle">Chọn chương và trả lời ngẫu nhiên để ôn luyện hiệu quả</p>
</header>

<div class="chapter-nav" id="chapterNav"></div>

<div class="quiz-container">
  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-pill"><span class="dot dot-progress"></span><span id="statProgress">0/0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="stat-pill"><span class="dot dot-correct"></span><span id="statCorrect">0 Đúng</span></div>
    <div class="stat-pill"><span class="dot dot-wrong"></span><span id="statWrong">0 Sai</span></div>
  </div>

  <div id="quiz-area"></div>
  <div id="result-panel">
    <div class="result-score" id="finalScore"></div>
    <div class="result-label">điểm số của bạn</div>
    <div class="result-grid">
      <div class="result-stat"><div class="num correct-num" id="finalCorrect"></div><div class="lbl">Câu Đúng</div></div>
      <div class="result-stat"><div class="num wrong-num" id="finalWrong"></div><div class="lbl">Câu Sai</div></div>
      <div class="result-stat"><div class="num" id="finalTotal"></div><div class="lbl">Tổng Câu</div></div>
    </div>
    <div class="result-msg" id="finalMsg"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn-primary" onclick="restartQuiz()">🔀 Làm Lại (Ngẫu Nhiên)</button>
      <button class="btn-secondary" onclick="showAllAnswers()">📋 Xem Tất Cả Đáp Án</button>
    </div>
  </div>
</div>

<script>
const CHAPTERS = {
  "Chương 1": [
    { q: "Để nghiên cứu kinh tế - chính trị Mác - Lênin, phương pháp nào quan trọng nhất?", opts: ["Mô hình hoá","Trừu tượng hoá khoa học","Phân tích và tổng hợp","Điều tra thống kê"], ans: 1 },
    { q: "Phát biểu nào sau đây là sai về đối tượng nghiên cứu của KTCT?", opts: ["Đối tượng nghiên cứu của KTCT là quan hệ thuộc một lĩnh vực","Nghiên cứu KTCT phải đặt trong mối liên hệ biện chứng với LLSX và kiến trúc thượng tầng","KTCT không nghiên cứu biểu hiện kỹ thuật của sự sản xuất và trao đổi","Đối tượng nghiên cứu của KTCT là quan hệ xã hội của sản xuất và trao đổi"], ans: 0 },
    { q: "Chủ nghĩa trọng nông nghiên cứu lĩnh vực gì?", opts: ["Lưu thông","Sản xuất","Phân phối","Cung cầu"], ans: 1 },
    { q: "Học thuyết kinh tế nào của C.Mác được coi là nền tảng tư tưởng cho công nhân và nhân dân lao động?", opts: ["Học thuyết giá trị thặng dư","Học thuyết tái sản xuất tư bản xã hội","Học thuyết tích luỹ tư sản","Học thuyết giá trị lao động"], ans: 0 },
    { q: "Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?", opts: ["Hoạt động sản xuất của cải vật chất","Hoạt động nghệ thuật, thể thao","Hoạt động chính trị","Hoạt động khoa học"], ans: 0 },
    { q: "Mục đích nghiên cứu KTCT Mác - Lênin. Chọn ý SAI:", opts: ["Phát hiện ra các quy luật kinh tế","Cung cấp cơ sở khoa học góp phần thúc đẩy trình độ văn minh","Vận dụng các quy luật để giải quyết hài hòa các quan hệ lợi ích","Tìm ra mối liên hệ giữa quan hệ sản xuất và kiến trúc thượng tầng tương ứng"], ans: 3 },
    { q: "Để xem xét, giải thích nguồn gốc sâu xa của các hiện tượng kinh tế xã hội phải xuất phát từ:", opts: ["Từ truyền thống lịch sử","Từ ý thức xã hội","Từ hệ tư tưởng của giai cấp thống trị","Từ các hoạt động kinh tế"], ans: 3 },
    { q: "Chủ nghĩa trọng thương nghiên cứu lĩnh vực gì?", opts: ["Sản xuất","Tiêu dùng","Lưu thông","Phân phối"], ans: 2 },
    { q: "Thuật ngữ 'Kinh tế - chính trị' được sử dụng lần đầu tiên vào năm nào?", opts: ["1815","1615","1715","1651"], ans: 1 },
    { q: "Chức năng phương pháp luận của kinh tế - chính trị Mác - Lênin thể hiện ở:", opts: ["Vận dụng vào các hoạt động thực tiễn lao động cũng như quản trị quốc gia","Thấy sự gắn kết giữa KTCT với nội hàm của các khái niệm kinh tế chuyên ngành","Góp phần xây dựng lý tưởng khoa học","Làm phong phú tri thức, tư duy lý luận các cá nhân về các quan hệ kinh tế"], ans: 1 },
    { q: "Chức năng nhận thức của kinh tế - chính trị Mác - Lênin là nhằm:", opts: ["Phát hiện bản chất của các hiện tượng và quy luật kinh tế","Nghiên cứu mối quan hệ giữa quan hệ sản xuất với lực lượng sản xuất","Tìm ra các quy luật kinh tế chi phối sự vận động của sản xuất và trao đổi","Cung cấp hệ thống tri thức mở, những phạm trù kinh tế cơ bản"], ans: 3 },
    { q: "Thuật ngữ chỉ mối liên hệ chặt chẽ giữa quy luật kinh tế với khía cạnh thực tiễn của hoạt động chính trị gọi là?", opts: ["Kinh tế chính trị","Kinh tế học","Kinh tế công","Kinh tế - xã hội"], ans: 0 },
    { q: "Hệ thống lý luận kinh tế đầu tiên nghiên cứu về nền sản xuất tư bản chủ nghĩa là?", opts: ["Kinh tế chính trị Mác - Lênin","Chủ nghĩa trọng thương","Chủ nghĩa trọng nông","Kinh tế chính trị tư sản cổ điển"], ans: 3 },
    { q: "Người sáng lập ra chủ nghĩa Mác là:", opts: ["Các Mác","C.Mác và Ph.Ăng ghen","C.Mác và V.I. Lênin","C.Mác, Ph. Ăng ghen và V.I. Lênin"], ans: 1 },
    { q: "Trừu tượng hoá khoa học là:", opts: ["Đi từ những hiện tượng ngẫu nhiên để rút ra bản chất bên trong","Gạt bỏ các hiện tượng ngẫu nhiên, bề ngoài, giữ lại những mối liên hệ phổ biến mang tính bản chất","Gạt bỏ những bộ phận phức tạp của đối tượng nghiên cứu","Quá trình đi từ cụ thể đến trừu tượng và ngược lại"], ans: 1 },
    { q: "Chức năng tư tưởng của kinh tế - chính trị Mác–Lênin thể hiện ở:", opts: ["Định vị vai trò, trách nhiệm của các cá nhân","Xây dựng nền tảng tư tưởng người lao động","Là cơ sở khoa học để giải quyết hài hòa các quan hệ lợi ích","Cải thiện đời sống vật chất và tinh thần của toàn xã hội"], ans: 1 },
    { q: "Ai là người đầu tiên đưa ra khái niệm 'Kinh tế - chính trị'?", opts: ["William Petty","Francois Quesney","Tomas Mun","Antoine de Montchrestien"], ans: 3 },
    { q: "Đối tượng nghiên cứu của kinh tế - chính trị Mác - Lênin là:", opts: ["Quan hệ xã hội của sản xuất và trao đổi","Quan hệ trao đổi giữa người với người trong sản xuất","Quan hệ kỹ thuật của sự sản xuất và trao đổi","Quan hệ giữa các quá trình sản xuất, phân phối, trao đổi, tiêu dùng"], ans: 0 },
    { q: "Kinh tế - chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của:", opts: ["Chủ nghĩa trọng thương","Kinh tế - chính trị tầm thường","Kinh tế chính trị tư sản cổ điển","Chủ nghĩa trọng nông"], ans: 2 },

const ALL_KEY = "Tất Cả";
let currentChapter = ALL_KEY;
let questions = [];
let answers = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChapterNav() {
  const nav = document.getElementById('chapterNav');
  const keys = [ALL_KEY, ...Object.keys(CHAPTERS)];
  nav.innerHTML = keys.map(k => `<button class="chapter-btn${k===currentChapter?' active':''}" onclick="selectChapter('${k}')">${k}</button>`).join('');
}

function selectChapter(ch) {
  currentChapter = ch;
  buildChapterNav();
  restartQuiz();
}

function getQuestions() {
  if (currentChapter === ALL_KEY) {
    return Object.entries(CHAPTERS).flatMap(([chName, qs]) => qs.map(q => ({...q, chapter: chName})));
  }
  return (CHAPTERS[currentChapter] || []).map(q => ({...q, chapter: currentChapter}));
}

function restartQuiz() {
  answers = {};
  const pool = getQuestions();
  questions = shuffle(pool).map((q, i) => ({
    ...q,
    id: i,
    opts: (() => {
      // shuffle options and adjust answer index
      const indexed = q.opts.map((o, idx) => ({o, idx}));
      const shuffled = shuffle(indexed);
      return { opts: shuffled.map(x => x.o), ans: shuffled.findIndex(x => x.idx === q.ans) };
    })()
  }));
  // flatten
  questions = questions.map(q => ({...q, opts: q.opts.opts, ans: q.opts.ans}));
  document.getElementById('result-panel').style.display = 'none';
  renderQuiz();
  updateStats();
  document.getElementById('statsBar').style.display = questions.length ? 'flex' : 'none';
  window.scrollTo(0, 0);
}

function renderQuiz() {
  const area = document.getElementById('quiz-area');
  if (!questions.length) {
    area.innerHTML = '<div class="empty-state"><p>Không có câu hỏi nào.</p></div>';
    return;
  }

  const letters = ['A','B','C','D'];
  area.innerHTML = questions.map((q, qi) => `
    <div class="question-card" id="qcard-${qi}">
      <div class="q-meta">
        <span class="q-number">Câu ${qi+1}</span>
        <span class="q-chapter">${q.chapter}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options-grid">
        ${q.opts.map((opt, oi) => `
          <button class="option-btn" id="opt-${qi}-${oi}" onclick="selectAnswer(${qi},${oi})">
            <span class="option-letter">${letters[oi]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="result-badge" id="rbadge-${qi}"></div>
    </div>
  `).join('') + `
  <div class="actions">
    <button class="btn-primary" onclick="checkAllDone()">📊 Xem Kết Quả</button>
    <button class="btn-secondary" onclick="restartQuiz()">🔀 Làm Lại</button>
  </div>`;
}

function selectAnswer(qi, oi) {
  // Already answered this question
  if (answers[qi] !== undefined) return;

  answers[qi] = oi;
  const q = questions[qi];
  const letters = ['A','B','C','D'];
  const rightAns = q.ans;

  // Apply correct/wrong styling and disable all options for this question
  q.opts.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;
    if (i === rightAns) btn.classList.add('correct');
    else if (i === oi) btn.classList.add('wrong');
  });

  // Show inline feedback badge
  const badge = document.getElementById(`rbadge-${qi}`);
  if (oi === rightAns) {
    badge.className = 'result-badge correct-msg show';
    badge.innerHTML = `✅ Chính xác! Đáp án: <strong>${letters[rightAns]}. ${q.opts[rightAns]}</strong>`;
  } else {
    badge.className = 'result-badge wrong-msg show';
    badge.innerHTML = `❌ Sai rồi! Đáp án đúng là: <strong>${letters[rightAns]}. ${q.opts[rightAns]}</strong>`;
  }

  updateStats();

  // If all questions answered, auto-show result button highlight
  if (Object.keys(answers).length === questions.length) {
    const btn = document.querySelector('.btn-primary');
    if (btn) btn.style.animation = 'pulse 0.6s ease 2';
  }
}

function updateStats() {
  const total = questions.length;
  const answered = Object.keys(answers).length;
  const correct = Object.keys(answers).filter(qi => answers[qi] === questions[qi].ans).length;
  const wrong = answered - correct;
  document.getElementById('statProgress').textContent = `${answered}/${total}`;
  document.getElementById('statCorrect').textContent = `${correct} Đúng`;
  document.getElementById('statWrong').textContent = `${wrong} Sai`;
  const pct = total ? (answered / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function checkAllDone() {
  const correct = Object.keys(answers).filter(qi => answers[qi] === questions[qi].ans).length;
  showResults(correct);
}

function submitQuiz() { checkAllDone(); }

function showResults(correct) {
  const total = questions.length;
  const wrong = total - correct;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalCorrect').textContent = correct;
  document.getElementById('finalWrong').textContent = wrong;
  document.getElementById('finalTotal').textContent = total;
  let msg = '';
  if (pct >= 90) msg = '🏆 Xuất sắc! Bạn đã nắm vững kiến thức!';
  else if (pct >= 70) msg = '👍 Khá tốt! Hãy ôn lại những câu sai.';
  else if (pct >= 50) msg = '📚 Cần cố gắng thêm! Ôn luyện nhiều hơn nhé.';
  else msg = '💪 Đừng nản! Hãy đọc lại lý thuyết và thử lại!';
  document.getElementById('finalMsg').textContent = msg;
  const panel = document.getElementById('result-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showAllAnswers() {
  document.getElementById('result-panel').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
buildChapterNav();
restartQuiz();
</script>
